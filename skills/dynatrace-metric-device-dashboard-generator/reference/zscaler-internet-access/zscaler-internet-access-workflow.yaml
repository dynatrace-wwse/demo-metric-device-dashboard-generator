tasks:
  zscaler_internet_access_v1:
    action: dynatrace.automations:run-javascript
    active: true
    description: Inject Zscaler Internet Access BizEvents.
    input:
      script: |
        export default async function () {
          const EXPIRES_AT = "2026-08-27T00:00:00-07:00"; // null = no expiry
          if (EXPIRES_AT && Date.now() >= Date.parse(EXPIRES_AT)) return { status: "expired", expiresAt: EXPIRES_AT };
          const EVENT_PROVIDER = "zscaler.zia.event.provider";
          const TOTAL_EVENTS = 3600;
          const BATCH_SIZE = 500;
          const now = Date.now();
          const sites = [
            { site: "us-west", region: "na-west", lat: 37.7749, lon: -122.4194 },
            { site: "us-east", region: "na-east", lat: 40.7128, lon: -74.0060 },
            { site: "eu-central", region: "eu-central", lat: 50.1109, lon: 8.6821 },
            { site: "ap-south", region: "ap-south", lat: 19.0760, lon: 72.8777 },
            { site: "ap-southeast", region: "ap-southeast", lat: 1.3521, lon: 103.8198 }
          ];
          const userSegments = ["engineering", "finance", "sales", "support", "exec"];
          const appCategories = ["saas", "web", "collaboration", "development", "file-sharing"];
          const actions = ["allow", "allow", "allow", "block", "challenge"];
          const severities = ["low", "medium", "high", "critical"];
          const outcomes = ["ok", "ok", "ok", "degraded", "failed"];
          const eventTypes = [
            "zia.tunnel.health","zia.web.transaction","zia.security.threat","zia.policy.decision",
            "zia.dns.lookup","zia.user.experience","zia.ssl.inspection","zia.bandwidth.anomaly",
            "zia.app.performance","zia.auth.posture","zia.location.load","zia.policy.hit",
            "zia.ipsec.status","zia.private.app.access","zia.sandbox.verdict","zia.edge.health"
          ];

          const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
          const rnd = (min, max) => Math.random() * (max - min) + min;
          const int = (min, max) => Math.floor(rnd(min, max + 1));
          const events = [];

          for (let i = 0; i < TOTAL_EVENTS; i++) {
            const loc = rand(sites);
            const et = eventTypes[i % eventTypes.length];
            const ts = new Date(now - int(0, 30 * 60 * 1000)).toISOString();
            events.push({
              "event.provider": EVENT_PROVIDER,
              "event.type": et,
              timestamp: ts,
              site: loc.site,
              pop_region: loc.region,
              zia_node: `${loc.site}-node-${int(1, 12)}`,
              user_segment: rand(userSegments),
              app_category: rand(appCategories),
              outcome: rand(outcomes),
              throughput_mbps: Number(rnd(40, 2500).toFixed(2)),
              tunnel_latency_ms: Number(rnd(8, 180).toFixed(2)),
              packet_loss_pct: Number(rnd(0.01, 3.2).toFixed(2)),
              dns_lookup_ms: Number(rnd(8, 220).toFixed(2)),
              user_experience_score: Number(rnd(58, 99.8).toFixed(1)),
              policy_action: rand(actions),
              threat_severity: rand(severities),
              threat_count: int(0, 7),
              "geo.location.latitude": loc.lat,
              "geo.location.longitude": loc.lon
            });
          }

          let sent = 0;
          for (let i = 0; i < events.length; i += BATCH_SIZE) {
            const batch = events.slice(i, i + BATCH_SIZE);
            const res = await fetch("/platform/classic/environment-api/v2/bizevents/ingest", {
              method: "POST",
              headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify(batch)
            });
            if (!res.ok) {
              const body = await res.text();
              throw new Error(`BizEvents ingest failed: ${res.status} ${body}`);
            }
            sent += batch.length;
          }

          return { status: "ok", sent };
        }
    name: zscaler_internet_access_v1
    position:
      x: 0
      "y": 1
  zscaler_internet_access_logs_v1:
    action: dynatrace.automations:run-javascript
    active: true
    conditions:
      states:
        zscaler_internet_access_v1: OK
    description: Inject synthetic ZIA logs.
    input:
      script: |
        export default async function () {
          const EXPIRES_AT = "2026-08-27T00:00:00-07:00"; // null = no expiry
          if (EXPIRES_AT && Date.now() >= Date.parse(EXPIRES_AT)) return { status: "expired", expiresAt: EXPIRES_AT };
          const TOTAL_LOGS = 1800;
          const BATCH_SIZE = 300;
          const now = Date.now();

          const sites = [
            { site: "us-west", region: "na-west", nodePrefix: "usw" },
            { site: "us-east", region: "na-east", nodePrefix: "use" },
            { site: "eu-central", region: "eu-central", nodePrefix: "euc" },
            { site: "ap-south", region: "ap-south", nodePrefix: "aps" },
            { site: "ap-southeast", region: "ap-southeast", nodePrefix: "apse" }
          ];

          const severities = ["INFO", "INFO", "INFO", "WARN", "ERROR"];
          const actions = ["allow", "allow", "allow", "block", "challenge"];
          const categories = ["dns", "policy", "tunnel", "threat", "ssl", "auth"];

          const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
          const int = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

          const logs = [];
          for (let i = 0; i < TOTAL_LOGS; i++) {
            const loc = rand(sites);
            const level = rand(severities);
            const action = rand(actions);
            const category = rand(categories);
            const node = `${loc.nodePrefix}-node-${int(1, 12)}`;
            const ts = new Date(now - int(0, 30 * 60 * 1000)).toISOString();
            const latency = int(8, 220);
            const dns = int(6, 240);
            const threatScore = int(0, 100);

            const message = `[ZIA] ${category} event at ${loc.site}; action=${action}; node=${node}; latency_ms=${latency}; dns_ms=${dns}; threat_score=${threatScore}`;

            logs.push({
              timestamp: ts,
              content: message,
              severity: level,
              loglevel: level,
              "log.source": "zscaler.zia.synthetic",
              "event.provider": "zscaler.zia.event.provider",
              site: loc.site,
              pop_region: loc.region,
              zia_node: node,
              policy_action: action,
              event_category: category,
              tunnel_latency_ms: latency,
              dns_lookup_ms: dns,
              threat_score: threatScore
            });
          }

          let sent = 0;
          for (let i = 0; i < logs.length; i += BATCH_SIZE) {
            const batch = logs.slice(i, i + BATCH_SIZE);
            const body = JSON.stringify(batch);
            const res = await fetch("/platform/classic/environment-api/v2/logs/ingest", {
              method: "POST",
              headers: { "content-type": "application/json; charset=utf-8" },
              body
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Log ingest failed: ${res.status} ${err}`);
            }
            sent += batch.length;
          }

          return { status: "ok", sent, source: "zscaler.zia.synthetic" };
        }
    name: zscaler_internet_access_logs_v1
    position:
      x: 0
      "y": 2
    predecessors:
      - zscaler_internet_access_v1
  zscaler_internet_access_entities_v1:
    action: dynatrace.automations:run-javascript
    active: true
    conditions:
      states:
        zscaler_internet_access_v1: OK
    description: Emit MINT metrics keyed by custom device dimensions.
    input:
      script: |
        export default async function () {
          const EXPIRES_AT = "2026-08-27T00:00:00-07:00"; // null = no expiry
          if (EXPIRES_AT && Date.now() >= Date.parse(EXPIRES_AT)) return { status: "expired", expiresAt: EXPIRES_AT };
          // Smartscape entities are created from BizEvents via OpenPipeline.
          return { status: "ok", message: "Entity extraction handled by OpenPipeline smartscapeNode processor." };
        }
    name: zscaler_internet_access_entities_v1
    position:
      x: 0
      "y": 3
    predecessors:
      - zscaler_internet_access_v1
